<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Knowledge Graph</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; touch-action: none; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        .tooltip {
            position: absolute; background: rgba(28,28,30,0.95); color: #fff;
            padding: 10px 14px; border-radius: 10px; font-size: 12px;
            pointer-events: none; backdrop-filter: blur(8px); display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.55); max-width: 280px; z-index: 10;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .tooltip-title { font-weight: 700; font-size: 13px; margin-bottom: 3px; color: #fff; }
        .tooltip-detail { font-size: 11px; opacity: 0.85; line-height: 1.4; color: #ccc; }
        .empty-state {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            text-align: center; color: #888; pointer-events: none;
        }
        .empty-state-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
        .graph-controls {
            position: absolute; right: 16px; bottom: 24px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .graph-btn {
            width: 42px; height: 42px; border-radius: 21px;
            background: rgba(30,30,32,0.88); color: #fff; border: 1px solid rgba(255,255,255,0.15);
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35); backdrop-filter: blur(10px);
            touch-action: manipulation; user-select: none; transition: transform 0.15s, background 0.15s;
        }
        .graph-btn:active { background: rgba(80,80,85,0.95); transform: scale(0.92); }
        .graph-btn.active { background: #7C4DFF; color: #fff; border-color: #7C4DFF; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="tooltip" id="tooltip"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-state-icon">&#128279;</div>
        <p style="font-size:18px;margin-bottom:8px;font-weight:600;">No connections yet</p>
        <p style="font-size:14px;">Add notes with [[wikilinks]] or matching tags to see your knowledge web</p>
    </div>
    <div class="graph-controls">
        <button class="graph-btn" id="btn-freeze" title="Freeze / Unfreeze Physics">&#x23F8;</button>
        <button class="graph-btn" id="btn-zoom-in" title="Zoom In">+</button>
        <button class="graph-btn" id="btn-zoom-out" title="Zoom Out">&minus;</button>
        <button class="graph-btn" id="btn-fit" title="Fit View">&#x26F6;</button>
    </div>

    <script>
    (function() {
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var tooltip = document.getElementById('tooltip');
        var emptyState = document.getElementById('empty-state');
        var btnFreeze = document.getElementById('btn-freeze');
        var dpr = window.devicePixelRatio || 1;
        var W, H;

        var theme = {
            primary: '#7C4DFF',
            surface: '#1a1a1a',
            onSurface: '#e0e0e0',
            edge: '#555',
            edgeLabel: '#999'
        };
        var tagColors = ['#7C4DFF','#448AFF','#00BCD4','#00C853','#FF6D00','#FF1744','#AA00FF','#2979FF'];

        var nodes = [], edges = [], nodeMap = {};
        var transform = { x: 0, y: 0, k: 1 };
        var drag = null, pinchDist = null, pinchDistK = null;
        var hoveredNode = null;
        var selectedNodeId = null;
        var filterQuery = '';
        var filterTag = '';
        var filterMinDegree = 0; // 0 = all, 1 = connected, 3 = hubs only
        var isPhysicsFrozen = false;
        var animFrame = null;
        var lastTapTime = 0;
        var lastTapNode = null;

        function resize() {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function getTagColor(tags) {
            if (!tags || !tags.length) return theme.primary;
            var h = 0, t = tags[0];
            for (var i = 0; i < t.length; i++) { h = ((h << 5) - h) + t.charCodeAt(i); h = h & h; }
            return tagColors[Math.abs(h) % tagColors.length];
        }

        function getNodeDegree(nodeId) {
            var count = 0;
            for (var i = 0; i < edges.length; i++) {
                if (edges[i].from === nodeId || edges[i].to === nodeId) count++;
            }
            return count;
        }

        function getRadius(n) {
            var deg = getNodeDegree(n.noteId);
            var base = 18;
            var degreeBonus = Math.min(deg * 3.5, 20); // Centrality scaling
            var wcBonus = Math.min((n.wordCount || 0) / 600, 1) * 10;
            return base + degreeBonus + wcBonus;
        }

        function getSemanticEdgeColor(edge, dimmed) {
            if (dimmed) return 'rgba(90,90,90,0.06)';
            var label = (edge.label || '').toLowerCase();
            if (label.indexOf('contradict') !== -1) return '#FF1744'; // Crimson red
            if (label.indexOf('support') !== -1) return '#00E676'; // Emerald green
            if (label.indexOf('build') !== -1) return '#00E5FF'; // Cyan
            if (label.indexOf('link') !== -1) return theme.primary; // Vibrant purple
            if (label.indexOf('share') !== -1) return '#FFB300'; // Amber
            return theme.edge || '#666';
        }

        function screenToWorld(sx, sy) {
            return { x: (sx - transform.x) / transform.k, y: (sy - transform.y) / transform.k };
        }

        function simulate() {
            var alpha = 0.25;
            var charge = -350, linkDist = 115, centerGrav = 0.04;

            function tick() {
                if (isPhysicsFrozen) return;
                if (alpha < 0.001) return;
                alpha *= 0.98;

                // Center gravity
                nodes.forEach(function(n) {
                    n.vx += (W/2 - n.x) * centerGrav * alpha;
                    n.vy += (H/2 - n.y) * centerGrav * alpha;
                });

                // Charge (repulsion)
                for (var i = 0; i < nodes.length; i++) {
                    for (var j = i+1; j < nodes.length; j++) {
                        var dx = nodes[j].x - nodes[i].x;
                        var dy = nodes[j].y - nodes[i].y;
                        var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                        var force = charge * alpha / (dist * dist);
                        var fx = dx / dist * force;
                        var fy = dy / dist * force;
                        nodes[i].vx -= fx; nodes[i].vy -= fy;
                        nodes[j].vx += fx; nodes[j].vy += fy;
                    }
                }

                // Link attraction
                edges.forEach(function(e) {
                    var s = nodeMap[e.from], t = nodeMap[e.to];
                    if (!s || !t) return;
                    var dx = t.x - s.x, dy = t.y - s.y;
                    var dist = Math.sqrt(dx*dx + dy*dy) || 1;
                    var force = (dist - linkDist) * 0.025 * alpha;
                    var fx = dx / dist * force;
                    var fy = dy / dist * force;
                    s.vx += fx; s.vy += fy;
                    t.vx -= fx; t.vy += fy;
                });

                // Apply velocity with damping
                nodes.forEach(function(n) {
                    if (n === drag) return;
                    n.vx *= 0.82; n.vy *= 0.82;
                    n.x += n.vx; n.y += n.vy;
                });
            }

            return { tick: tick, isSettled: function() { return isPhysicsFrozen || alpha < 0.001; } };
        }

        var sim = simulate();

        function render() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            ctx.translate(transform.x, transform.y);
            ctx.scale(transform.k, transform.k);

            // Active focus / ego network target
            var focusId = selectedNodeId || (hoveredNode ? hoveredNode.noteId : null);

            // 1. Draw edges with semantic coloring
            edges.forEach(function(e) {
                var s = nodeMap[e.from], t = nodeMap[e.to];
                if (!s || !t) return;

                var degS = getNodeDegree(e.from);
                var degT = getNodeDegree(e.to);
                if (degS < filterMinDegree || degT < filterMinDegree) return;

                var dimmed = focusId && focusId !== e.from && focusId !== e.to;
                var edgeColor = getSemanticEdgeColor(e, dimmed);

                ctx.beginPath();
                var dx = t.x - s.x, dy = t.y - s.y;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var mx = (s.x + t.x) / 2 + dy * 0.12;
                var my = (s.y + t.y) / 2 - dx * 0.12;
                ctx.moveTo(s.x, s.y);
                ctx.quadraticCurveTo(mx, my, t.x, t.y);
                ctx.strokeStyle = edgeColor;
                ctx.globalAlpha = dimmed ? 0.06 : (focusId ? 0.9 : 0.45);
                ctx.lineWidth = Math.max(1.4, e.strength * (focusId && !dimmed ? 3.8 : 2.6));
                ctx.stroke();
                ctx.globalAlpha = 1;

                // Directional Arrow
                if (!dimmed && dist > 40) {
                    var angle = Math.atan2(t.y - my, t.x - mx);
                    var rT = getRadius(t);
                    var ax = t.x - Math.cos(angle) * rT;
                    var ay = t.y - Math.sin(angle) * rT;
                    ctx.save();
                    ctx.translate(ax, ay);
                    ctx.rotate(angle);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(-8, -4);
                    ctx.lineTo(-8, 4);
                    ctx.closePath();
                    ctx.fillStyle = edgeColor;
                    ctx.globalAlpha = 0.75;
                    ctx.fill();
                    ctx.restore();
                    ctx.globalAlpha = 1;
                }

                // Relationship label
                if (!dimmed && dist > 60 && (focusId || transform.k > 0.8)) {
                    ctx.font = '500 9px -apple-system, sans-serif';
                    ctx.fillStyle = theme.edgeLabel;
                    ctx.textAlign = 'center';
                    ctx.fillText(e.label, mx, my - 4);
                }
            });

            // 2. Draw nodes with hub rings, glows, and pill labels
            nodes.forEach(function(n) {
                var deg = getNodeDegree(n.noteId);
                if (deg < filterMinDegree) return;

                var isSelected = selectedNodeId && selectedNodeId === n.noteId;
                var isHub = deg >= 3;

                var matchesFilter = true;
                if (filterQuery) {
                    matchesFilter = matchesFilter && n.title.toLowerCase().indexOf(filterQuery) !== -1;
                }
                if (filterTag) {
                    matchesFilter = matchesFilter && n.tags && n.tags.some(function(t){ return t.toLowerCase() === filterTag; });
                }

                // Ego network check: is n directly connected to focusId?
                var isConnectedToFocus = focusId && (focusId === n.noteId || edges.some(function(e){
                    return (e.from === focusId && e.to === n.noteId) || (e.to === focusId && e.from === n.noteId);
                }));

                var dimmed = !matchesFilter || (focusId && !isConnectedToFocus);
                var r = getRadius(n);
                var color = getTagColor(n.tags);

                // Hub Note Outer Halo / Ring
                if (isHub && !dimmed) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.35;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }

                // Active Focus / Search Match Glow
                if (isSelected || (!dimmed && (filterQuery || filterTag))) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, r + 9, 0, Math.PI * 2);
                    ctx.fillStyle = theme.primary;
                    ctx.globalAlpha = 0.38;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                } else if (!dimmed) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, r + 4, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.16;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // Solid Circle
                ctx.beginPath();
                ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
                ctx.globalAlpha = dimmed ? 0.12 : 0.90;
                ctx.fillStyle = color;
                ctx.fill();

                // Border Ring
                ctx.strokeStyle = isSelected ? '#FFFFFF' : (isHub ? '#FFFFFF' : color);
                ctx.lineWidth = isSelected ? 3.5 : (isHub ? 2.5 : 2);
                ctx.globalAlpha = dimmed ? 0.1 : 0.85;
                ctx.stroke();
                ctx.globalAlpha = 1;

                // Hub badge icon (star glyph)
                if (isHub && !dimmed && r >= 24) {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(deg.toString(), n.x, n.y);
                }

                // 3. Readable Title with Dark Pill Background
                var label = n.title.length > 24 ? n.title.substring(0, 24) + '...' : n.title;
                ctx.font = isHub ? 'bold 11px -apple-system, sans-serif' : '500 11px -apple-system, sans-serif';
                var textWidth = ctx.measureText(label).width;
                var pillH = 18;
                var pillW = textWidth + 12;
                var pillX = n.x - pillW / 2;
                var pillY = n.y + r + 5;

                // Draw pill background
                ctx.beginPath();
                ctx.roundRect(pillX, pillY, pillW, pillH, 9);
                ctx.fillStyle = dimmed ? 'rgba(20,20,20,0.1)' : 'rgba(20,20,24,0.85)';
                ctx.fill();

                // Draw text
                ctx.fillStyle = dimmed ? 'rgba(200,200,200,0.15)' : theme.onSurface;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, n.x, pillY + pillH / 2);
            });

            ctx.restore();
        }

        function animate() {
            sim.tick();
            render();
            if (!sim.isSettled()) {
                animFrame = requestAnimationFrame(animate);
            }
        }

        function getNodeAt(sx, sy) {
            var wp = screenToWorld(sx, sy);
            for (var i = nodes.length - 1; i >= 0; i--) {
                var n = nodes[i];
                var deg = getNodeDegree(n.noteId);
                if (deg < filterMinDegree) continue;
                var dx = wp.x - n.x, dy = wp.y - n.y;
                var r = getRadius(n);
                if (dx*dx + dy*dy < r * r) return n;
            }
            return null;
        }

        // Center on a specific node smoothly
        function focusOnNode(n) {
            selectedNodeId = n.noteId;
            var targetK = 1.4;
            transform.k = targetK;
            transform.x = W / 2 - n.x * targetK;
            transform.y = H / 2 - n.y * targetK;
            render();
        }

        canvas.addEventListener('mousedown', function(ev) {
            var now = Date.now();
            var n = getNodeAt(ev.clientX, ev.clientY);

            if (now - lastTapTime < 300) {
                // Double-tap detected
                if (n) {
                    focusOnNode(n);
                    try { Android.onNodeTapped(n.noteId); } catch(e) {}
                } else {
                    window.fitView();
                }
                lastTapTime = 0;
                return;
            }
            lastTapTime = now;

            if (n) { drag = n; n.fx = ev.clientX; n.fy = ev.clientY; }
            else { drag = { mode: '_pan', sx: ev.clientX, sy: ev.clientY, tx: transform.x, ty: transform.y }; }
        });

        canvas.addEventListener('mousemove', function(ev) {
            if (drag && drag.mode !== '_pan') {
                var wp = screenToWorld(ev.clientX, ev.clientY);
                drag.x = wp.x; drag.y = wp.y;
                render();
            } else if (drag && drag.mode === '_pan') {
                transform.x = drag.tx + (ev.clientX - drag.sx);
                transform.y = drag.ty + (ev.clientY - drag.sy);
                render();
            } else {
                var n = getNodeAt(ev.clientX, ev.clientY);
                if (n !== hoveredNode) { hoveredNode = n; render(); }
                if (n) {
                    tooltip.style.display = 'block';
                    tooltip.textContent = '';
                    var titleEl = document.createElement('div');
                    titleEl.className = 'tooltip-title';
                    titleEl.textContent = n.title;
                    var detailEl = document.createElement('div');
                    detailEl.className = 'tooltip-detail';
                    var connCount = getNodeDegree(n.noteId);
                    var isHub = connCount >= 3 ? ' • Hub Note' : '';
                    var tagStr = n.tags && n.tags.length ? '<br>#' + n.tags.join(' #') : '';
                    detailEl.innerHTML = n.wordCount + ' words • ' + connCount + ' connections' + isHub + tagStr;
                    tooltip.appendChild(titleEl);
                    tooltip.appendChild(detailEl);
                    tooltip.style.left = Math.min(W - 220, ev.clientX + 14) + 'px';
                    tooltip.style.top = Math.max(10, ev.clientY - 14) + 'px';
                } else {
                    tooltip.style.display = 'none';
                }
            }
        });

        canvas.addEventListener('mouseup', function(ev) {
            if (drag && drag.mode !== '_pan' && drag.fx !== undefined) {
                var dx = ev.clientX - drag.fx, dy = ev.clientY - drag.fy;
                if (dx*dx + dy*dy < 36) {
                    selectedNodeId = drag.noteId;
                    render();
                    try { Android.onNodeTapped(drag.noteId); } catch(e) {}
                }
            }
            drag = null;
        });

        canvas.addEventListener('wheel', function(ev) {
            ev.preventDefault();
            var factor = ev.deltaY > 0 ? 0.88 : 1.14;
            zoom(factor, ev.clientX, ev.clientY);
        }, { passive: false });

        function zoom(factor, cx, cy) {
            cx = cx !== undefined ? cx : W / 2;
            cy = cy !== undefined ? cy : H / 2;
            var newK = Math.max(0.15, Math.min(4.5, transform.k * factor));
            var wx = (cx - transform.x) / transform.k;
            var wy = (cy - transform.y) / transform.k;
            transform.k = newK;
            transform.x = cx - wx * newK;
            transform.y = cy - wy * newK;
            render();
        }

        // Touch support for pinch zoom and drag
        canvas.addEventListener('touchstart', function(ev) {
            var now = Date.now();
            if (ev.touches.length === 1) {
                var t = ev.touches[0];
                var n = getNodeAt(t.clientX, t.clientY);

                if (now - lastTapTime < 350) {
                    // Double tap on touch
                    if (n) {
                        focusOnNode(n);
                        try { Android.onNodeTapped(n.noteId); } catch(e) {}
                    } else {
                        window.fitView();
                    }
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;

                if (n) { drag = n; n.fx = t.clientX; n.fy = t.clientY; }
                else { drag = { mode: '_pan', sx: t.clientX, sy: t.clientY, tx: transform.x, ty: transform.y }; }
            } else if (ev.touches.length === 2) {
                drag = { mode: '_pinch' };
                var dx = ev.touches[0].clientX - ev.touches[1].clientX;
                var dy = ev.touches[0].clientY - ev.touches[1].clientY;
                pinchDist = Math.sqrt(dx*dx + dy*dy);
                pinchDistK = transform.k;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', function(ev) {
            ev.preventDefault();
            if (drag && drag.mode === '_pinch' && ev.touches.length === 2 && pinchDist) {
                var dx = ev.touches[0].clientX - ev.touches[1].clientX;
                var dy = ev.touches[0].clientY - ev.touches[1].clientY;
                var dist = Math.sqrt(dx*dx + dy*dy);
                var newK = Math.max(0.15, Math.min(4.5, pinchDistK * (dist / pinchDist)));
                var cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
                var cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
                var wx = (cx - transform.x) / transform.k;
                var wy = (cy - transform.y) / transform.k;
                transform.k = newK;
                transform.x = cx - wx * newK;
                transform.y = cy - wy * newK;
                render();
            } else if (drag && drag.mode !== '_pan' && drag.mode !== '_pinch') {
                var t = ev.touches[0];
                var wp = screenToWorld(t.clientX, t.clientY);
                drag.x = wp.x; drag.y = wp.y;
                render();
            } else if (drag && drag.mode === '_pan' && ev.touches.length === 1) {
                var t = ev.touches[0];
                transform.x = drag.tx + (t.clientX - drag.sx);
                transform.y = drag.ty + (t.clientY - drag.sy);
                render();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function(ev) {
            if (drag && drag.mode !== '_pan' && drag.mode !== '_pinch' && drag.fx !== undefined) {
                try { Android.onNodeTapped(drag.noteId); } catch(e) {}
            }
            drag = null; pinchDist = null;
        });

        // Controls wiring
        btnFreeze.addEventListener('click', function(e) {
            e.stopPropagation();
            isPhysicsFrozen = !isPhysicsFrozen;
            btnFreeze.innerHTML = isPhysicsFrozen ? '&#x25B6;' : '&#x23F8;';
            btnFreeze.className = isPhysicsFrozen ? 'graph-btn active' : 'graph-btn';
            btnFreeze.title = isPhysicsFrozen ? 'Resume Physics' : 'Freeze Physics';
            if (!isPhysicsFrozen) {
                sim = simulate();
                animate();
            }
        });

        document.getElementById('btn-zoom-in').addEventListener('click', function(e) {
            e.stopPropagation(); zoom(1.25);
        });
        document.getElementById('btn-zoom-out').addEventListener('click', function(e) {
            e.stopPropagation(); zoom(0.8);
        });
        document.getElementById('btn-fit').addEventListener('click', function(e) {
            e.stopPropagation(); window.fitView();
        });

        // Public API
        window.loadGraph = function(json) {
            try {
                var data = typeof json === 'string' ? JSON.parse(json) : json;
                // Golden-ratio phyllotaxis spiral layout for organic instant separation
                nodes = (data.nodes || []).map(function(n, i) {
                    var phi = i * 2.39996; // Golden angle (radians)
                    var dist = Math.min(W, H) * 0.08 * Math.sqrt(i + 1);
                    return {
                        noteId: n.noteId,
                        title: n.title,
                        wordCount: n.wordCount || 0,
                        tags: n.tags || [],
                        x: W / 2 + dist * Math.cos(phi),
                        y: H / 2 + dist * Math.sin(phi),
                        vx: 0,
                        vy: 0
                    };
                });
                edges = data.edges || [];
                nodeMap = {};
                nodes.forEach(function(n) { nodeMap[n.noteId] = n; });
                transform = { x: 0, y: 0, k: 1 };
                hoveredNode = null;
                sim = simulate();
                if (!nodes.length) { emptyState.style.display = 'block'; } else { emptyState.style.display = 'none'; }
                if (animFrame) cancelAnimationFrame(animFrame);
                animate();
                setTimeout(function() { window.fitView(); }, 350);
            } catch(e) { console.error('Graph load error:', e); emptyState.style.display = 'block'; }
        };

        window.fitView = function() {
            if (!nodes.length) return;
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodes.forEach(function(n) {
                var r = getRadius(n) + 30;
                if (n.x - r < minX) minX = n.x - r;
                if (n.x + r > maxX) maxX = n.x + r;
                if (n.y - r < minY) minY = n.y - r;
                if (n.y + r > maxY) maxY = n.y + r;
            });
            var graphW = Math.max(100, maxX - minX);
            var graphH = Math.max(100, maxY - minY);
            var padding = 55;
            var scale = Math.min((W - padding * 2) / graphW, (H - padding * 2) / graphH, 1.4);
            scale = Math.max(0.25, Math.min(2.0, scale));
            var midX = (minX + maxX) / 2;
            var midY = (minY + maxY) / 2;
            transform.k = scale;
            transform.x = W / 2 - midX * scale;
            transform.y = H / 2 - midY * scale;
            render();
        };

        window.filterGraph = function(query, tag, minDegree) {
            filterQuery = (query || '').toLowerCase().trim();
            filterTag = (tag || '').toLowerCase().trim();
            filterMinDegree = parseInt(minDegree, 10) || 0;
            render();
        };

        window.selectNode = function(noteId) {
            selectedNodeId = noteId || null;
            if (noteId && nodeMap[noteId]) {
                focusOnNode(nodeMap[noteId]);
            } else {
                render();
            }
        };

        window.setGraphTheme = function(c) {
            if (typeof c === 'string') c = JSON.parse(c);
            if (c.primary) theme.primary = c.primary;
            if (c.surface) { theme.surface = c.surface; document.body.style.background = c.surface; }
            if (c.onSurface) theme.onSurface = c.onSurface;
            if (c.edge) theme.edge = c.edge;
            if (c.edgeLabel) theme.edgeLabel = c.edgeLabel;
        };

        resize();
        window.addEventListener('resize', resize);
    })();
    </script>
</body>
</html>
