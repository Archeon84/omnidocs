<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Editor</title>
    <style>
        :root {
            --color-text: #1a1a1a;
            --color-bg: #ffffff;
            --color-code-bg: #f0f0f0;
            --color-quote-bg: #f9f9f9;
            --color-quote-border: #ddd;
            --color-border: #ddd;
            --color-muted: #767676;
            --color-link: #0066cc;
            --color-th-bg: #f5f5f5;
            --color-hr: #ddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', 'Noto Sans', 'Noto Sans Arabic', 'Noto Sans CJK SC', 'Noto Sans CJK TC', 'Noto Sans CJK JP', 'Noto Sans CJK KR', 'Noto Sans Devanagari', 'Noto Sans Thai', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text);
            background: var(--color-bg);
            padding: 16px;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        #editor {
            outline: none;
            min-height: calc(100vh - 100px);
            padding: 8px;
            unicode-bidi: plaintext;
        }

        #editor:empty:before {
            content: "Start writing...";
            color: var(--color-muted);
            pointer-events: none;
        }

        #editor:focus {
            outline: 2px solid var(--color-link);
            outline-offset: 2px;
            border-radius: 4px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 16px 0 8px;
            color: var(--color-text);
        }

        h2 {
            font-size: 22px;
            font-weight: 500;
            margin: 14px 0 6px;
            color: var(--color-text);
        }

        h3 {
            font-size: 16px;
            font-weight: 500;
            margin: 12px 0 4px;
            color: var(--color-text);
        }

        p {
            margin: 8px 0;
        }

        ul, ol {
            margin: 8px 0;
            padding-inline-start: 24px;
            padding-inline-end: 0;
        }

        li {
            margin: 4px 0;
        }

        blockquote {
            border-inline-start: 3px solid var(--color-quote-border);
            margin: 8px 0;
            padding: 8px 16px;
            background: var(--color-quote-bg);
            font-style: italic;
        }

        code {
            background: var(--color-code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Noto Sans Mono', monospace;
            font-size: 14px;
        }

        pre {
            background: var(--color-code-bg);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        pre code {
            background: none;
            padding: 0;
        }

        hr {
            border: none;
            border-top: 1px solid var(--color-hr);
            margin: 16px 0;
        }

        a {
            color: var(--color-link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 8px 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }

        th, td {
            border: 1px solid var(--color-border);
            padding: 8px 12px;
            text-align: start;
        }

        th {
            background: var(--color-th-bg);
            font-weight: bold;
        }

        .delete-btn {
            display: inline-block;
            padding: 4px 10px;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #d32f2f;
            cursor: pointer;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 4px;
            user-select: none;
            transition: background 0.15s ease;
        }
        .delete-btn:active {
            background: #ffcdd2;
        }

        .collapsible-heading {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-inline-start: 20px;
        }
        .collapsible-heading::before {
            content: '\25B8';
            position: absolute;
            inset-inline-start: 0;
            transition: transform 0.2s;
            font-size: 0.8em;
        }
        .collapsible-heading.expanded::before {
            transform: rotate(90deg);
        }
        .collapsible-content {
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .collapsible-content.collapsed {
            max-height: 0 !important;
            opacity: 0;
        }

        @keyframes citationPulse {
            0% {
                background-color: rgba(255, 214, 0, 0.85);
                box-shadow: 0 0 0 3px rgba(255, 214, 0, 0.5);
            }
            50% {
                background-color: rgba(255, 214, 0, 0.55);
                box-shadow: 0 0 0 2px rgba(255, 214, 0, 0.3);
            }
            100% {
                background-color: rgba(255, 214, 0, 0.35);
                box-shadow: none;
            }
        }
        .citation-highlight {
            animation: citationPulse 2.5s ease-out forwards;
            background-color: rgba(255, 214, 0, 0.35);
            border-bottom: 2px solid #f57f17;
            border-radius: 3px;
            padding: 1px 2px;
            display: inline;
        }
    </style>
</head>
<body>
    <div contenteditable="true" id="editor" dir="auto" role="textbox" aria-multiline="true" aria-label="Note content"><!-- CONTENT_PLACEHOLDER --></div>

    <script>
        const editor = document.getElementById('editor');

        // Notify Android of editor focus state
        editor.addEventListener('focus', function() {
            try { Android.onEditorFocusChanged(true); } catch(e) {}
        });
        editor.addEventListener('blur', function() {
            try { Android.onEditorFocusChanged(false); } catch(e) {}
        });

        // Debounce timer for content sync
        let debounceTimer;

        // Debounce timer for format state sync
        let formatStateTimer;

        // IME composition state
        let isComposing = false;
        editor.addEventListener('compositionstart', function() {
            isComposing = true;
        });
        editor.addEventListener('compositionend', function() {
            isComposing = false;
            notifyContentChanged();
        });

        // Notify Android of content changes
        function notifyContentChanged() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                if (isComposing) return;
                if (window.Android && window.Android.onContentChanged) {
                    window.Android.onContentChanged(editor.innerHTML);
                }
            }, 300);
        }

        editor.addEventListener('input', function() {
            if (!isComposing) {
                notifyContentChanged();
            }
        });

        // Event delegation for attachment deletion
        editor.addEventListener('click', function(e) {
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                e.preventDefault();
                e.stopPropagation();
                const attachmentId = deleteBtn.getAttribute('data-attachment-id');
                const target = attachmentId ? document.getElementById(attachmentId) : deleteBtn.closest('.attachment');
                if (target) {
                    target.remove();
                    notifyContentChanged();
                }
            }
        });

        // Notify Android of format state changes (debounced selection change)
        editor.addEventListener('keyup', function() { notifyFormatState(); });
        editor.addEventListener('mouseup', function() { notifyFormatState(); });
        editor.addEventListener('click', function() { notifyFormatState(); });

        function notifyFormatState() {
            clearTimeout(formatStateTimer);
            formatStateTimer = setTimeout(function() {
                if (window.Android && window.Android.onFormatStateChanged) {
                    window.Android.onFormatStateChanged(JSON.stringify({
                        bold: document.queryCommandState('bold'),
                        italic: document.queryCommandState('italic'),
                        underline: document.queryCommandState('underline'),
                        strike: document.queryCommandState('strikeThrough'),
                        orderedList: document.queryCommandState('insertOrderedList'),
                        unorderedList: document.queryCommandState('insertUnorderedList')
                    }));
                }
            }, 50);
        }

        // Set editor theme colors from Android
        function setTheme(colors) {
            // colors: { text, background, codeBg, quoteBg, quoteBorder, border, muted, link, thBg, hr }
            const root = document.documentElement;
            if (colors.text) root.style.setProperty('--color-text', colors.text);
            if (colors.background) root.style.setProperty('--color-bg', colors.background);
            if (colors.codeBg) root.style.setProperty('--color-code-bg', colors.codeBg);
            if (colors.quoteBg) root.style.setProperty('--color-quote-bg', colors.quoteBg);
            if (colors.quoteBorder) root.style.setProperty('--color-quote-border', colors.quoteBorder);
            if (colors.border) root.style.setProperty('--color-border', colors.border);
            if (colors.muted) root.style.setProperty('--color-muted', colors.muted);
            if (colors.link) root.style.setProperty('--color-link', colors.link);
            if (colors.thBg) root.style.setProperty('--color-th-bg', colors.thBg);
            if (colors.hr) root.style.setProperty('--color-hr', colors.hr);
        }

        // Set document language and direction
        function setLanguage(lang, dir) {
            if (lang) document.documentElement.setAttribute('lang', lang);
            const resolvedDir = dir || (lang === 'ar' ? 'rtl' : 'auto');
            document.documentElement.setAttribute('dir', resolvedDir);
            editor.setAttribute('dir', resolvedDir);
        }

        // Helper functions for formatting
        function formatText(command, value) {
            document.execCommand(command, false, value || null);
            editor.focus();
        }

        function formatHeading() {
            editor.focus();
            let node = window.getSelection()?.anchorNode;
            if (node && node.nodeType === 3) node = node.parentElement;
            let currentHeading = node ? node.closest('h1, h2, h3, p, div') : null;
            let tag = currentHeading ? currentHeading.tagName.toLowerCase() : 'p';

            let nextTag = 'h2';
            if (tag === 'h2') nextTag = 'h3';
            else if (tag === 'h3') nextTag = 'p';
            else nextTag = 'h2';

            try {
                document.execCommand('formatBlock', false, '<' + nextTag + '>');
            } catch(e) {
                document.execCommand('formatBlock', false, nextTag);
            }
            initCollapsibles();
            notifyFormatState();
        }

        function formatCode() {
            editor.focus();
            const sel = window.getSelection();
            if (!sel || !sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            let node = sel.anchorNode;
            if (node && node.nodeType === 3) node = node.parentElement;
            const codeParent = node ? node.closest('code, pre') : null;

            if (codeParent) {
                // Unwrap code
                const textNode = document.createTextNode(codeParent.textContent);
                codeParent.parentNode.replaceChild(textNode, codeParent);
            } else if (!sel.isCollapsed) {
                // Wrap selection in <code>
                const text = range.toString();
                const codeEl = document.createElement('code');
                codeEl.textContent = text;
                range.deleteContents();
                range.insertNode(codeEl);
                sel.removeAllRanges();
                const newRange = document.createRange();
                newRange.selectNodeContents(codeEl);
                sel.addRange(newRange);
            } else {
                // Insert code snippet at cursor
                document.execCommand('insertHTML', false, '<code>&nbsp;</code>');
            }
            notifyFormatState();
        }

        function wrapSelection(before, after) {
            const selection = window.getSelection();
            if (selection.rangeCount) {
                const range = selection.getRangeAt(0);
                const selectedText = range.toString();
                range.deleteContents();
                range.insertNode(document.createTextNode(before + selectedText + after));
            }
        }

        // Update content from Android
        function updateContent(content) {
            editor.innerHTML = content;
            initCollapsibles();
        }

        // Get content for Android
        function getContent() {
            return editor.innerHTML;
        }

        // Clear editor
        function clearContent() {
            editor.innerHTML = '';
        }

        // Insert HTML at cursor
        function insertHtml(html) {
            editor.focus();
            document.execCommand('insertHTML', false, html);
        }

        function toggleCollapse(heading) {
            heading.classList.toggle('expanded');
            heading.classList.toggle('collapsed');
            const content = heading.nextElementSibling;
            if (content && content.classList.contains('collapsible-content')) {
                content.classList.toggle('collapsed');
            }
        }

        function toggleAllCollapse() {
            const headings = document.querySelectorAll('.collapsible-heading');
            const anyExpanded = Array.from(headings).some(h => h.classList.contains('expanded'));
            headings.forEach(h => {
                if (anyExpanded) {
                    h.classList.add('collapsed');
                    h.classList.remove('expanded');
                } else {
                    h.classList.add('expanded');
                    h.classList.remove('collapsed');
                }
                const content = h.nextElementSibling;
                if (content && content.classList.contains('collapsible-content')) {
                    if (anyExpanded) {
                        content.classList.add('collapsed');
                    } else {
                        content.classList.remove('collapsed');
                    }
                }
            });
        }

        function initCollapsibles() {
            document.querySelectorAll('h2, h3').forEach(heading => {
                if (heading.classList.contains('collapsible-heading')) return;
                heading.classList.add('collapsible-heading', 'expanded');
                heading.onclick = () => toggleCollapse(heading);

                let content = [];
                let sibling = heading.nextElementSibling;
                while (sibling && !['H1', 'H2', 'H3'].includes(sibling.tagName)) {
                    content.push(sibling);
                    sibling = sibling.nextElementSibling;
                }
                if (content.length > 0) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'collapsible-content expanded';
                    heading.parentNode.insertBefore(wrapper, heading.nextSibling);
                    content.forEach(el => wrapper.appendChild(el));
                }
            });
        }
        // Scroll the cursor into view when the keyboard opens
        function scrollCursorIntoView() {
            var sel = window.getSelection();
            if (sel.rangeCount > 0) {
                var range = sel.getRangeAt(0);
                var rect = range.getBoundingClientRect();
                var editorRect = editor.getBoundingClientRect();
                // Only scroll if cursor is actually hidden below the visible area
                if (rect.bottom > editorRect.bottom) {
                    range.startContainer.parentElement && range.startContainer.parentElement.scrollIntoView({
                        block: 'end',
                        behavior: 'smooth'
                    });
                }
            }
        }

        // Get currently selected text
        function getSelectedText() {
            var sel = window.getSelection();
            return sel ? sel.toString() : "";
        }

        // Notify Android when text selection changes
        var lastSelectedText = "";
        document.addEventListener('selectionchange', function() {
            var sel = window.getSelection();
            var text = sel ? sel.toString() : "";
            if (text !== lastSelectedText) {
                lastSelectedText = text;
                try {
                    Android.onTextSelectionChanged(text);
                } catch(e) {}
            }
        });
        // Remove citation highlights and clean up fragmented text nodes
        function removeCitationHighlights() {
            var highlights = document.querySelectorAll('.citation-highlight');
            highlights.forEach(function(el) {
                var parent = el.parentNode;
                if (!parent) return;
                while (el.firstChild) {
                    parent.insertBefore(el.firstChild, el);
                }
                parent.removeChild(el);
            });
            if (editor) {
                editor.normalize();
            }
        }

        // Highlight and scroll to cited text across multi-node spans and formatting tags
        function findAndScrollToText(searchText) {
            if (!searchText) return;
            removeCitationHighlights();

            // 1. Gather all text nodes inside editor and compute character offsets in flat text
            var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
            var textNodes = [];
            var rawConcatenated = "";
            var nodeOffsets = [];
            var curr;
            while (curr = walker.nextNode()) {
                var val = curr.nodeValue;
                if (!val) continue;
                textNodes.push(curr);
                nodeOffsets.push({
                    node: curr,
                    start: rawConcatenated.length,
                    end: rawConcatenated.length + val.length
                });
                rawConcatenated += val;
            }

            if (nodeOffsets.length === 0 || !rawConcatenated.trim()) return;

            // 2. Prepare normalized full text for searching (whitespace collapsed to single space)
            // normToRaw maps normalized character index -> rawConcatenated character index
            var normToRaw = [];
            var normFullText = "";
            var prevWasSpace = false;
            for (var i = 0; i < rawConcatenated.length; i++) {
                var ch = rawConcatenated[i];
                var isSpace = /\s/.test(ch);
                if (isSpace) {
                    if (!prevWasSpace && normFullText.length > 0) {
                        normToRaw.push(i);
                        normFullText += " ";
                        prevWasSpace = true;
                    }
                } else {
                    normToRaw.push(i);
                    normFullText += ch.toLowerCase();
                    prevWasSpace = false;
                }
            }

            // 3. Prepare candidate query phrases from searchText
            // Strip markdown, quotes, ellipses, leading/trailing whitespace
            var cleanQuery = searchText
                .replace(/^["'«“\s]+|["'»”\s]+$/g, '')
                .replace(/^\.{2,}|[\.]{2,}$/g, '')
                .trim();

            var candidates = [];
            var normQuery = cleanQuery.toLowerCase().replace(/\s+/g, ' ').trim();
            if (normQuery.length >= 10) {
                candidates.push(normQuery.length > 150 ? normQuery.substring(0, 150).trim() : normQuery);
            }

            // Candidate B: Distinctive sentences inside the snippet
            var sentences = cleanQuery.split(/[\n.!?]+/);
            for (var s = 0; s < sentences.length; s++) {
                var sent = sentences[s].toLowerCase().replace(/\s+/g, ' ').trim();
                if (sent.length >= 20) {
                    candidates.push(sent);
                }
            }

            // Candidate C: Leading word sequences
            var words = normQuery.split(' ');
            if (words.length >= 6) {
                candidates.push(words.slice(0, 10).join(' '));
                candidates.push(words.slice(0, 6).join(' '));
            }

            // Fallback: full normQuery if not already present
            if (candidates.indexOf(normQuery) === -1 && normQuery.length > 0) {
                candidates.push(normQuery);
            }

            // 4. Find match in normalized full text
            var matchNormStart = -1;
            var matchNormEnd = -1;
            for (var c = 0; c < candidates.length; c++) {
                var cand = candidates[c];
                if (!cand) continue;
                var idx = normFullText.indexOf(cand);
                if (idx !== -1) {
                    matchNormStart = idx;
                    matchNormEnd = idx + cand.length;
                    break;
                }
            }

            if (matchNormStart === -1) return;

            // 5. Convert normalized match boundaries back to rawConcatenated offsets
            var rawStart = normToRaw[matchNormStart];
            var rawEnd = matchNormEnd < normToRaw.length ? normToRaw[matchNormEnd] : rawConcatenated.length;

            // 6. Find all text nodes overlapping [rawStart, rawEnd] and wrap them safely
            var spans = [];
            for (var n = 0; n < nodeOffsets.length; n++) {
                var item = nodeOffsets[n];
                if (item.end <= rawStart || item.start >= rawEnd) {
                    continue;
                }

                var nodeText = item.node.nodeValue;
                var localStart = Math.max(0, rawStart - item.start);
                var localEnd = Math.min(nodeText.length, rawEnd - item.start);

                if (localStart < localEnd) {
                    var range = document.createRange();
                    range.setStart(item.node, localStart);
                    range.setEnd(item.node, localEnd);

                    var span = document.createElement('span');
                    span.className = 'citation-highlight';
                    try {
                        range.surroundContents(span);
                        spans.push(span);
                    } catch(e) {
                        try {
                            var frag = range.extractContents();
                            span.appendChild(frag);
                            range.insertNode(span);
                            spans.push(span);
                        } catch(e2) {}
                    }
                }
            }

            if (spans.length > 0) {
                var firstSpan = spans[0];
                var collapsedParent = firstSpan.closest('.collapsible-content.collapsed');
                if (collapsedParent) {
                    collapsedParent.classList.remove('collapsed');
                    var heading = collapsedParent.previousElementSibling;
                    if (heading) heading.classList.add('expanded');
                }
                firstSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    </script>
</body>
</html>
